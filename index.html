<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kids Learning</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6c4cf1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Learn"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,#ece6ff,#ffe9f3);min-height:100vh;color:#24204a;font-size:18px}
.wrap{max-width:760px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
h1{text-align:center;margin:8px 0 14px}h2{margin:0 0 10px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 20px #6c4cf122;margin-bottom:14px}
button{font:inherit;border:0;border-radius:16px;padding:14px 18px;min-height:60px;min-width:60px;cursor:pointer;background:#6c4cf1;color:#fff;font-weight:700;touch-action:manipulation}
button:active{transform:scale(.97)}button.alt{background:#efeaff;color:#4b33c4}button.pink{background:#ff5fa2}button.sm{min-height:48px;padding:10px 14px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}.kids{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.kids button{min-height:140px;font-size:22px}
.grp{font-weight:800;margin:14px 0 6px;color:#6c4cf1}.lv.sel{outline:4px solid #ff5fa2}
.choice{display:block;width:100%;text-align:left;margin:10px 0;background:#f4f1ff;color:#24204a;min-height:68px;font-size:19px}
.choice.right{background:#b9f3c9}.choice.wrong{background:#ffc9c9}.passage{background:#fffbe8;border-left:5px solid #f5c542;padding:12px;border-radius:10px;margin-bottom:10px;line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.big{font-size:1.35rem;line-height:1.4}
.bar{height:12px;background:#eee;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#ff5fa2;transition:width .3s}
.badge{display:inline-block;background:#fff4c2;border-radius:99px;padding:8px 12px;margin:3px;font-size:.95rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modes button{min-height:84px}
table{width:100%;border-collapse:collapse;font-size:16px}td,th{padding:8px 6px;border-bottom:1px solid #eee;text-align:left}
.timer{font-size:1.6rem;font-weight:800;color:#ff5fa2}.streak{font-weight:800;color:#ff7a00}
#fx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#24204acc;z-index:9;flex-direction:column;color:#fff;text-align:center}
#fx.on{display:flex}#fx .lvup{font-size:3rem;font-weight:900;animation:pop 1s ease-out}#fx .burst{font-size:5rem;animation:spin 1.2s ease-out}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}@keyframes spin{0%{transform:rotate(-180deg) scale(0)}100%{transform:rotate(0) scale(1)}}
.conf{position:fixed;top:-20px;font-size:28px;animation:fall 2.2s linear forwards;z-index:10}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.tip{background:#eafff0;border-radius:12px;padding:10px;margin:6px 0}
#sheet{position:fixed;inset:0;background:#24204acc;z-index:8;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(10px + env(safe-area-inset-top)) 10px 20px}#sheet.on{display:block}
#sheet .card{max-width:640px;margin:0 auto 12px}
.sc-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}.sc-ico{font-size:2.2rem;background:#efeaff;border-radius:18px;min-width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.sc-head h2{margin:0}.sc-sub{color:#6c4cf1;font-weight:700;font-size:.9rem}
.lbl{font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}
.what{font-size:1.15rem;line-height:1.45;margin:6px 0}
ol.steps{margin:0;padding-left:1.3em;line-height:1.5}ol.steps li{margin:6px 0}
.ex{background:#fffbe8;border-left:5px solid #f5c542;border-radius:12px;padding:10px 12px}.ex .exq{font-weight:800;margin-bottom:6px}
.tipbox{background:#eafff0;border-left:5px solid #2fbf71;border-radius:12px;padding:10px 12px;margin-top:12px}
.why{background:#fff6f6;border-left:5px solid #ff5fa2;border-radius:12px;padding:10px 12px;margin:10px 0;text-align:left}
.ok{background:#effff4;border-left:5px solid #2fbf71;border-radius:12px;padding:10px 12px;margin:10px 0}
.skl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;background:#f4f1ff;color:#24204a}.skl .sc-ico{min-width:48px;height:48px;font-size:1.6rem;background:#fff}
.pill{margin-left:auto;font-size:.85rem;background:#fff;border-radius:99px;padding:4px 10px;white-space:nowrap}
</style></head><body><div class="wrap" id="app"></div><div id="fx"></div><div id="sheet"></div>
<script src="content.js"></script>
<script>
// All data stays on this device (localStorage). No network, no ads, no tracking.
const KEY='kidslearning_v1';
const newKid=(name,emoji,level)=>({name,emoji,level,stars:0,badges:[],best:{},skills:{},streak:0,lastDay:null,quizzes:0,lightBest:{}});
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{profiles:[newKid('Addy','🦄','6'),newKid('Lianna','🐬','4'),newKid('Dad','🧔','12')],cur:null,mute:false};
if(!S.profiles.some(p=>p.name==='Dad')&&!S.dadAdded){S.profiles.push(newKid('Dad','🧔','12'));}S.dadAdded=true;localStorage.setItem(KEY,JSON.stringify(S));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const app=document.getElementById('app'),fx=document.getElementById('fx');
const P=()=>S.profiles[S.cur];const lvName=l=>l==='K'?'Kindergarten':l==='College'?'College':'Grade '+l;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rank=st=>Math.floor(st/25)+1;const subjName=s=>s==='math'?'Math':'Reading & Writing';
// ---- sound (Web Audio synth, no files) ----
let AC;function tone(f,d=.12,type='sine',t0=0,v=.18){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SND={tap:()=>tone(660,.05,'triangle',0,.08),right:()=>{tone(660,.1,'triangle');tone(990,.15,'triangle',.08)},wrong:()=>{tone(220,.2,'sawtooth',0,.08);tone(160,.25,'sawtooth',.1,.07)},
 done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.11)),lvl:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,'square',i*.09,.07)),tick:()=>tone(1200,.03,'square',0,.04)};
document.addEventListener('click',e=>{if(e.target.closest('button:not(.choice)'))SND.tap()});
const muteBtn=()=>`<button class="alt sm" onclick="S.mute=!S.mute;save();render()" aria-label="sound">${S.mute?'🔇':'🔊'}</button>`;
let render=home;
function home(){render=home;S.cur=null;save();app.innerHTML=`<div class="row"><span></span>${muteBtn()}</div><h1>🌟 Kids Learning</h1><div class="card"><h2>Who's playing?</h2><div class="grid kids">${S.profiles.map((p,i)=>`<button onclick="S.cur=${i};menu()">${p.emoji}<br>${esc(p.name)}<br><small>⭐ ${p.stars} · Lv ${rank(p.stars)}${p.streak>1?' · 🔥'+p.streak:''}</small></button>`).join('')}<button class="alt" onclick="addP()">＋<br>Add kid</button></div></div>
<div class="row" style="justify-content:center"><button class="pink" onclick="board()">🏆 Family Leaderboard</button><button class="alt sm" onclick="gate()">👪 Parents</button></div>`}
function board(){render=board;const ks=S.profiles.map(p=>{const v=Object.values(p.skills),a=v.reduce((x,y)=>x+y.a,0),c=v.reduce((x,y)=>x+y.c,0);return{p,stars:p.stars,light:Math.max(0,...Object.values(p.lightBest||{})),streak:p.streak||0,acc:a?Math.round(c/a*100):0}});
 const cats=[['stars','⭐ Total stars',''],['light','⚡ Lightning best',' correct'],['streak','🔥 Streak',' days'],['acc','🎯 Accuracy','%']];
 const ov=ks.slice().sort((x,y)=>y.stars-x.stars);const lead=ov[0]&&ov[0].stars>0&&(!ov[1]||ov[0].stars>ov[1].stars)?ov[0].p:null;
 app.innerHTML=`<div class="row"><button class="alt sm" onclick="home()">← Back</button><b>🏆 Family Leaderboard</b>${muteBtn()}</div>
 <div class="card" style="text-align:center">${lead?`<div style="font-size:4rem;animation:pop 1s">👑</div><h2>${lead.emoji} ${esc(lead.name)} leads with ${lead.stars} ⭐!</h2>`:'<h2>No leader yet — play a quiz to grab the crown 👑</h2>'}</div>
 ${cats.map(([k,t,u])=>{const r=ks.slice().sort((x,y)=>y[k]-x[k]);return `<div class="card"><h2>${t}</h2><table>${r.map((x,i)=>`<tr><td style="width:44px;font-size:1.4rem">${x[k]>0&&i===0&&(!r[1]||r[0][k]>r[1][k])?'👑':['🥇','🥈','🥉'][i]||i+1}</td><td>${x.p.emoji} ${esc(x.p.name)}</td><td style="text-align:right"><b>${x[k]}${u}</b></td></tr>`).join('')}</table></div>`}).join('')}
 <div class="card"><small>📱 Scores are saved on this device only. To compete, everyone should play on the same phone or tablet — stats don't sync between devices.</small></div>`}
function addP(){const n=prompt('Name?');if(!n)return;S.profiles.push(newKid(n.slice(0,20),pick(['🌟','🐱','🦊','🐼','🚀','🌈']),'K'));save();home()}
function menu(){render=menu;const p=P();app.innerHTML=`<div class="row"><button class="alt sm" onclick="home()">← Switch</button><b>${p.emoji} ${esc(p.name)} · ⭐ ${p.stars} · Lv ${rank(p.stars)} ${p.streak?`<span class="streak">🔥 ${p.streak}-day</span>`:''}</b>${muteBtn()}</div>
<div class="card"><div class="bar"><i style="width:${p.stars%25*4}%"></i></div><small>${25-p.stars%25} ⭐ to Level ${rank(p.stars)+1}</small></div>
<div class="card"><h2>Pick your level</h2>${LEVELS.map(g=>`<div class="grp">${g.group}</div><div class="grid">${g.items.map(l=>`<button class="alt lv ${p.level===l?'sel':''}" onclick="P().level='${l}';save();menu()">${l}</button>`).join('')}</div>`).join('')}
<p>Now: <b>${lvName(p.level)}</b>${LEVEL_TOPICS[p.level]?' — Math: '+LEVEL_TOPICS[p.level]:''}</p></div>
<div class="card"><h2>Play</h2><div class="modes"><button onclick="start('math','practice')">➗ Math<br><small>Practice</small></button><button onclick="start('ela','practice')">📚 Reading<br><small>Practice</small></button>
<button class="pink" onclick="start('math','lightning')">⚡ Math<br><small>Lightning 60s</small></button><button class="pink" onclick="start('ela','lightning')">⚡ Reading<br><small>Lightning 60s</small></button></div>
<div class="row" style="margin-top:12px"><button class="alt" style="flex:1" onclick="progress()">📈 My progress</button></div></div>
<div class="card"><h2>📖 Study</h2><p style="margin-top:0">Learn a skill first, then practice it.</p><div class="modes"><button class="alt" onclick="studyMenu('math')">📖 Math<br><small>Study cards</small></button><button class="alt" onclick="studyMenu('ela')">📖 Reading<br><small>Study cards</small></button></div>
${(p.missed||[]).length?`<button style="width:100%;margin-top:10px;background:#ff7a00" onclick="review()">🔁 Review my mistakes (${p.missed.length})</button>`:'<div class="tip" style="margin-top:10px">🔁 Questions you miss show up here so you can try them again.</div>'}</div>
<div class="card"><h2>Badges</h2>${p.badges.length?p.badges.map(b=>`<span class="badge">${b}</span>`).join(''):'Finish a quiz to earn your first badge!'}</div>`}
let Q,qi,score,subj,mode,run,timer,tLeft,results,onlySkill=null;
function start(s,m,sk){subj=s;mode=m;onlySkill=sk||null;qi=0;score=0;run=0;results=[];Q=makeQuiz(s,P().level,m==='lightning'?60:10,onlySkill);
 if(m==='lightning'){tLeft=60;clearInterval(timer);timer=setInterval(()=>{tLeft--;const el=document.getElementById('tm');if(el)el.textContent='⏱ '+tLeft;if(tLeft<=5&&tLeft>0)SND.tick();if(tLeft<=0){clearInterval(timer);done()}},1000)}show()}
function quit(){clearInterval(timer);menu()}
function show(){render=show;const q=Q[qi];app.innerHTML=`<div class="row"><button class="alt sm" onclick="quit()">✕ Quit</button>${mode==='lightning'?`<span class="timer" id="tm">⏱ ${tLeft}</span>`:''}<b>${mode==='lightning'?'':(qi+1)+'/'+Q.length+' · '}✅ ${score}${run>=3?` <span class="streak">🔥${run}</span>`:''}</b>${muteBtn()}</div>
${mode!=='lightning'?`<div class="bar"><i style="width:${qi/Q.length*100}%"></i></div>`:''}
<div class="card">${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}<div class="row" style="justify-content:space-between"><small style="color:#6c4cf1;font-weight:700">${mode==='review'?'🔁 Review · ':''}${esc(q.skill)}</small>${mode!=='lightning'&&studyFor(q.skill,q.lv||P().level)?`<button class="alt sm" style="min-height:40px;padding:6px 12px" onclick="openStudy('${jsq(q.skill)}','${q.lv||P().level}',true)">📖 Study</button>`:''}</div><p class="big">${esc(q.q)}</p>${q.choices.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c)}</button>`).join('')}<div id="fb"></div></div>`;
app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b))}
function answer(b){const q=Q[qi],ok=q.choices[b.dataset.i]===q.answer;app.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(q.choices[x.dataset.i]===q.answer)x.classList.add('right')});
results.push({skill:q.skill,ok,s:q.subj||subj});if(ok){score++;run++;SND.right();if(run%5===0)confetti(8)}else{run=0;b.classList.add('wrong');SND.wrong()}
const p=P();p.missed=p.missed||[];const qk=q.q+'|'+(q.passage||'');p.missed=p.missed.filter(m=>m.q+'|'+(m.passage||'')!==qk);
if(!ok)p.missed.unshift({s:q.subj||subj,lv:q.lv||p.level,skill:q.skill,q:q.q,choices:q.choices,answer:q.answer,explain:q.explain,passage:q.passage||'',t:Date.now()});
p.missed=p.missed.slice(0,30);save();
if(mode==='lightning'){setTimeout(next,ok?350:900);return}
const sk=studyFor(q.skill,q.lv||P().level);
document.getElementById('fb').innerHTML=ok?`<div class="ok"><b>${run>=3?`🔥 ${run} in a row!`:'🎉 Correct!'}</b>${q.explain?`<details style="margin-top:6px"><summary>Why?</summary>${stepsHTML(q.explain)}</details>`:''}</div><button style="width:100%" onclick="next()">${qi+1<Q.length?'Next →':'Finish'}</button>`
:`<div class="why"><b>Not quite!</b> The answer is <b>${esc(q.answer)}</b>.${q.explain?`<div class="lbl" style="color:#ff5fa2">Here's why</div>${stepsHTML(q.explain)}`:''}<div style="margin-top:8px;font-size:.9rem">🔁 Saved to <b>Review my mistakes</b>.</div></div>
<div class="row">${sk?`<button class="alt" style="flex:1" onclick="openStudy('${jsq(q.skill)}','${q.lv||P().level}',true)">📖 Study: ${esc(q.skill)}</button>`:''}<button style="flex:1" onclick="next()">${qi+1<Q.length?'Next →':'Finish'}</button></div>`}
function next(){if(mode==='lightning'&&tLeft<=0)return;qi++;if(qi<Q.length)show();else done()}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function done(){clearInterval(timer);render=()=>{};const p=P(),lv=p.level,k=subj+lv,before=rank(p.stars),tot=results.length;
 results.forEach(r=>{const key=(r.s||subj)+'|'+r.skill,s=p.skills[key]||(p.skills[key]={a:0,c:0,lv:{}});s.a++;if(r.ok)s.c++;s.lv[lv]=1});
 const t=today();if(p.lastDay!==t){const y=new Date();y.setDate(y.getDate()-1);const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();p.streak=p.lastDay===yd?p.streak+1:1;p.lastDay=t}
 const nb=[];const add0=b=>{if(!p.badges.includes(b)){p.badges.push(b);nb.push(b)}};p.stars+=score;p.quizzes++;if(mode==='review'){if(score>0)add0('🔁 Mistake Fixer')}else if(onlySkill){}else if(mode==='practice')p.best[k]=Math.max(p.best[k]||0,score);else p.lightBest[k]=Math.max(p.lightBest[k]||0,score);
 const add=b=>{if(!p.badges.includes(b)){p.badges.push(b);nb.push(b)}};add('🎈 First Quiz');
 if(mode==='practice'&&!onlySkill&&score===10)add(`🏆 Perfect ${subjName(subj)} · ${lvName(lv)}`);if(mode==='lightning'&&score>=15)add('⚡ Lightning 15');if(mode==='lightning'&&score>=25)add('⚡ Lightning 25');
 if(p.streak>=3)add('🔥 3-Day Streak');if(p.streak>=7)add('🔥 7-Day Streak');[50,250,1000].forEach(n=>p.stars>=n&&add(`⭐ ${n} Stars`));save();
 const up=rank(p.stars)>before;const wrongs=results.filter(r=>!r.ok).length;
 app.innerHTML=`<div class="card" style="text-align:center"><h1>${score>=(mode==='lightning'?15:8)?'🌟 Amazing!':score>=5?'👍 Nice work!':'💪 Keep going!'}</h1>
<p class="big">${mode==='lightning'?`⚡ ${score} correct in 60 seconds`:`You got ${score}/${tot}`} · +${score} ⭐</p><p>${tot?Math.round(score/tot*100):0}% accuracy · <span class="streak">🔥 ${p.streak}-day streak</span></p>
${nb.map(b=>`<div class="badge">New: ${b}</div>`).join('')}${mode==='review'?`<p>${(p.missed||[]).length?`${p.missed.length} left to review.`:'🎉 You cleared all your mistakes!'}</p>`:''}
<div class="row" style="justify-content:center;margin-top:14px"><button onclick="${mode==='review'?'review()':`start(subj,mode${onlySkill?`,'${jsq(onlySkill)}'`:''})`}">🔁 Play again</button>${(p.missed||[]).length&&mode!=='review'?`<button style="background:#ff7a00" onclick="review()">🔁 Review mistakes (${p.missed.length})</button>`:''}<button class="alt" onclick="progress()">📈 Progress</button><button class="alt" onclick="menu()">Menu</button></div></div>`;
 SND.done();if(up)levelUp(rank(p.stars));else if(score>=8)confetti(20)}
function confetti(n){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='conf';e.textContent=pick(['🎉','⭐','✨','🎈','💜']);e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function levelUp(n){fx.innerHTML=`<div class="burst">🏅</div><div class="lvup">LEVEL UP!</div><p class="big">You reached Level ${n}</p><button class="pink" onclick="fx.className=''">Yay! →</button>`;fx.className='on';SND.lvl();confetti(40)}
function skillRows(p,subject){return Object.entries(p.skills).filter(([k])=>k.startsWith(subject+'|')).map(([k,s])=>({name:k.split('|')[1],a:s.a,pct:Math.round(s.c/s.a*100)})).sort((a,b)=>a.pct-b.pct)}
function progress(){render=progress;const p=P();const sec=s=>{const rows=skillRows(p,s);const weak=rows.filter(r=>r.a>=3&&r.pct<70).slice(0,3);
 const best=LEVELS.flatMap(g=>g.items).filter(l=>p.best[s+l]!=null||p.lightBest[s+l]!=null).map(l=>`<tr><td>${lvName(l)}</td><td>${p.best[s+l]??'—'}/10</td><td>${p.lightBest[s+l]??'—'}</td></tr>`).join('');
 return `<div class="card"><h2>${s==='math'?'➗':'📚'} ${subjName(s)}</h2>${rows.length?`<table><tr><th>Skill</th><th>Tried</th><th>Correct</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.a}</td><td>${r.pct>=85?'🟢':r.pct>=70?'🟡':'🔴'} ${r.pct}%</td></tr>`).join('')}</table>`:'<p>No quizzes yet.</p>'}
 ${best?`<h3>Best scores</h3><table><tr><th>Level</th><th>Practice</th><th>⚡ Lightning</th></tr>${best}</table>`:''}
 ${weak.length?`<h3>Suggestions</h3>${weak.map(w=>`<div class="tip">💡 Practice <b>${esc(w.name)}</b> more (${w.pct}% so far).${studyFor(w.name,p.level)?` <button class="alt sm" onclick="openStudy('${jsq(w.name)}','${p.level}',false,'${s}')">📖 Study it</button>`:''}</div>`).join('')}`:rows.length?'<div class="tip">🌟 No weak spots yet! Try Lightning or move up a level.</div>':''}</div>`};
 app.innerHTML=`<div class="row"><button class="alt sm" onclick="menu()">← Back</button><b>${p.emoji} ${esc(p.name)}'s progress</b>${muteBtn()}</div>
<div class="card"><div class="row"><span>⭐ ${p.stars} stars</span><span>Lv ${rank(p.stars)}</span><span class="streak">🔥 ${p.streak}-day</span><span>${p.quizzes} quizzes</span></div></div>${sec('math')}${sec('ela')}`}
// ---- study cards, explanations, review ----
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function stepsHTML(ex){const a=[].concat(ex||[]).filter(Boolean);if(!a.length)return'';return a.length===1?`<p style="margin:6px 0">${esc(a[0])}</p>`:`<ol class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}
function studyHTML(skill,lv){const c=studyFor(skill,lv);if(!c)return'';return `<div class="sc-head"><div class="sc-ico">${c.i}</div><div><div class="sc-sub">STUDY CARD · ${esc(lvName(lv))}</div><h2>${esc(skill)}</h2></div></div>
<div class="lbl" style="color:#6c4cf1">💡 The big idea</div><p class="what">${esc(c.what)}</p>
<div class="lbl" style="color:#6c4cf1">🪜 How to do it</div>${stepsHTML(c.steps.length>1?c.steps:[c.steps[0],''])}
<div class="lbl" style="color:#c99400">✏️ Worked example</div><div class="ex"><div class="exq">${esc(c.ex.q)}</div>${stepsHTML(c.ex.a)}</div>
<div class="tipbox"><b>⭐ Tip:</b> ${esc(c.tip)}</div>`}
const sheet=document.getElementById('sheet');
function openStudy(skill,lv,inQuiz,s){const sb=s||subj;sheet.innerHTML=`<div class="card">${studyHTML(skill,lv)}
<div class="row" style="margin-top:14px">${inQuiz?`<button style="flex:1" onclick="closeStudy()">← Back to my question</button>`:`<button class="alt" style="flex:1" onclick="closeStudy()">Close</button><button style="flex:1" onclick="closeStudy();start('${sb}','practice','${jsq(skill)}')">▶ Practice this</button>`}</div></div>`;sheet.className='on';sheet.scrollTop=0}
function closeStudy(){sheet.className='';sheet.innerHTML=''}
function studyMenu(s){render=()=>studyMenu(s);const p=P();const ks=skillsFor(s,p.level);app.innerHTML=`<div class="row"><button class="alt sm" onclick="menu()">← Back</button><b>📖 ${subjName(s)} · ${lvName(p.level)}</b>${muteBtn()}</div>
<div class="card"><h2>Pick a skill to learn</h2><p style="margin-top:0">Read the card, then tap <b>▶ Practice this</b>.</p>${ks.map(k=>{const c=studyFor(k,p.level)||{i:'📘'};const st=p.skills[s+'|'+k];const pc=st&&st.a?Math.round(st.c/st.a*100):null;return `<button class="skl" onclick="openStudy('${jsq(k)}','${p.level}',false,'${s}')"><span class="sc-ico">${c.i}</span><span>${esc(k)}</span><span class="pill">${pc==null?'New':(pc>=85?'🟢 ':pc>=70?'🟡 ':'🔴 ')+pc+'%'}</span></button>`}).join('')}</div>`}
function review(){const p=P();const list=(p.missed||[]).slice(0,10);if(!list.length){menu();return}subj=list[0].s;mode='review';onlySkill=null;qi=0;score=0;run=0;results=[];clearInterval(timer);
 Q=list.map(m=>({q:m.q,choices:shuffle(m.choices),answer:m.answer,explain:m.explain,passage:m.passage,skill:m.skill,subj:m.s,lv:m.lv}));show()}
function gate(){const a=R(6,12),b=R(6,12),ans=prompt(`Parents only: what is ${a} × ${b}?`);if(ans===null)return;if(parseInt(ans)===a*b)parents();else alert('Not quite — ask a grown-up!')}
function parents(){render=parents;app.innerHTML=`<div class="row"><button class="alt sm" onclick="home()">← Done</button><b>👪 Parent dashboard</b>${muteBtn()}</div>
${S.profiles.map((p,i)=>{const all=Object.entries(p.skills).map(([k,s])=>({n:k.replace('|',' · ').replace('math','Math').replace('ela','ELA'),pct:Math.round(s.c/s.a*100),a:s.a})).sort((x,y)=>x.pct-y.pct);
 const ta=all.reduce((x,y)=>x+y.a,0),tc=Object.values(p.skills).reduce((x,y)=>x+y.c,0);
 return `<div class="card"><h2>${p.emoji} ${esc(p.name)}</h2><p>Level setting: <b>${lvName(p.level)}</b> · ⭐ ${p.stars} · Lv ${rank(p.stars)} · 🔥 ${p.streak}-day streak · last played ${p.lastDay||'never'}</p>
 <p>${p.quizzes} quizzes · ${ta} questions · ${ta?Math.round(tc/ta*100):0}% correct · ${p.badges.length} badges</p>
 ${all.length?`<table><tr><th>Weakest → strongest</th><th>Tried</th><th>%</th></tr>${all.slice(0,8).map(r=>`<tr><td>${esc(r.n)}</td><td>${r.a}</td><td>${r.pct}%</td></tr>`).join('')}</table>`:''}
 <div class="row" style="margin-top:10px"><button class="alt sm" onclick="renameKid(${i})">✏️ Rename</button><button class="pink sm" onclick="resetKid(${i})">↺ Reset stats</button>${S.profiles.length>1?`<button class="alt sm" onclick="delKid(${i})">🗑 Remove</button>`:''}</div></div>`}).join('')}
<div class="card"><small>All progress is stored only on this device. Nothing is sent anywhere — no accounts, ads, or tracking.</small></div>`}
function resetKid(i){const p=S.profiles[i];if(!confirm(`Reset all stars, badges and progress for ${p.name}?`))return;S.profiles[i]=newKid(p.name,p.emoji,p.level);save();parents()}
function renameKid(i){const n=prompt('New name?',S.profiles[i].name);if(n){S.profiles[i].name=n.slice(0,20);save();parents()}}
function delKid(i){if(confirm(`Remove ${S.profiles[i].name}?`)){S.profiles.splice(i,1);save();parents()}}
S.cur!=null&&S.profiles[S.cur]?menu():home();
if('serviceWorker'in navigator&&location.protocol!=='file:'){const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloaded&&!sessionStorage.getItem('kl_reloaded')){reloaded=true;sessionStorage.setItem('kl_reloaded','1');location.reload()}});
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{});
 setTimeout(()=>sessionStorage.removeItem('kl_reloaded'),10000);}
</script></body></html>
